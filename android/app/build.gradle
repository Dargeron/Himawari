apply plugin: 'com.android.application'

// The app's version follows package.json: 2.0.0 -> versionCode 20000.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersion = packageJson.version
def (major, minor, patch) = appVersion.tokenize('.').collect { it.toInteger() }

// One app per language (-PhimawariEdition=en or zh-CN, default en). The
// English app keeps the original id so it updates the earlier two-language app;
// the Chinese app is a separate app beside it.
def edition = project.findProperty('himawariEdition') ?: 'en'
def editions = [
    'en'   : [id: 'io.github.dargeron.himawari', name: 'Himawari'],
    'zh-CN': [id: 'io.github.dargeron.himawari.zh', name: 'Himawari 向日葵'],
]
if (!editions.containsKey(edition)) throw new GradleException("Unknown himawariEdition: ${edition}")

// Release signing comes from the environment (GitHub Actions secrets or a
// local keystore); without it, Gradle produces an unsigned release.
def keystore = System.getenv('HIMAWARI_KEYSTORE')

android {
    namespace = "io.github.dargeron.himawari"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId editions[edition].id
        resValue 'string', 'app_name', editions[edition].name
        resValue 'string', 'title_activity_main', editions[edition].name
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Pictures, voices, music and fonts are already compressed. Storing them
    // as they are keeps the APK build fast and lets audio seek without
    // decompressing.
    buildFeatures {
        resValues = true
    }
    androidResources {
        noCompress += ['webp', 'mp3', 'm4a', 'woff2', 'png']
    }
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('HIMAWARI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HIMAWARI_KEY_ALIAS')
                keyPassword System.getenv('HIMAWARI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (keystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
