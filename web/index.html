<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0906">
<meta name="color-scheme" content="dark">
<meta name="description" content="Himawari — a sunflower, a town, and another day. Play in English or Simplified Chinese.">
<title>Himawari · English / 简体中文</title>
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<script>
// A returning player goes straight to the edition they chose, unless they
// came here to choose again (?choose).
(function () {
  try {
    var chosen = localStorage.getItem('himawari-language');
    if (!/[?&]choose\b/.test(location.search) && (chosen === 'en' || chosen === 'zh-CN')) {
      document.documentElement.className = 'leaving';
      location.replace(chosen + '/');
    }
  } catch (e) {}
})();
</script>
<style>
:root {
  --ink: #0d0906;
  --ink-box: rgba(13, 9, 6, 0.84);
  --ink-line: rgba(243, 234, 214, 0.18);
  --paper-on-ink: #f3ead6;
  --paper-dim: #cfc3a8;
  --paper-faint: rgba(243, 234, 214, 0.58);
  --sun: #e9b949;
  --font-story: 'EB Garamond', 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --font-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', 'Comic Neue', cursive;
  --font-kai: 'LXGW WenKai', 'Kaiti SC', 'STKaiti', KaiTi, 'Noto Serif CJK SC', 'Songti SC', serif;
  --edge: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
}
@font-face { font-family: 'EB Garamond'; font-style: italic; src: local('EB Garamond Italic'), local('EBGaramond-Italic'); }
@font-face { font-family: 'EB Garamond'; font-style: normal; src: local('EB Garamond'), local('EBGaramond-Regular'); }
@font-face { font-family: 'Caveat'; src: local('Caveat'), local('Caveat Regular'), local('Caveat-Regular'); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html.leaving body { visibility: hidden; }
body {
  overflow: hidden;
  background: var(--ink);
  color: var(--paper-on-ink);
  font-family: var(--font-story);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* The room with the sunflower, softly out of focus behind the ink. */
.scene {
  position: fixed;
  inset: -40px;
  background: var(--ink) url("assets/art/scenes/2464.webp") 62% 50% / cover no-repeat;
  filter: blur(7px) brightness(0.62) saturate(0.9);
  animation: settle 2.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.shade {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(90% 80% at 50% 50%, transparent 30%, rgba(13, 9, 6, 0.55) 100%),
    linear-gradient(to bottom, rgba(13, 9, 6, 0.25), transparent 30%, rgba(13, 9, 6, 0.35));
}
@keyframes settle { from { opacity: 0; transform: scale(1.04); } }

main {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: max(20px, env(safe-area-inset-top)) var(--edge) max(20px, env(safe-area-inset-bottom));
  overflow-y: auto;
}

/* The ink box: the same dark wash as the game's story box, ragged edge and all. */
.box {
  position: relative;
  isolation: isolate;
  width: min(38rem, 100%);
  padding: clamp(28px, 5vw, 48px) clamp(24px, 5vw, 56px) clamp(24px, 4vw, 36px);
  text-align: center;
  animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 150ms both;
}
.box::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--ink-box);
  box-shadow: 0 0 40px 24px rgba(13, 9, 6, 0.42);
  border-radius: 3px;
  filter: url(#ink-edge);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

.flower {
  display: block;
  width: auto;
  height: clamp(74px, 12vh, 110px);
  margin: -4px auto 6px;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
  transform-origin: 50% 95%;
  animation: sway 9s ease-in-out infinite alternate;
}
@keyframes sway { from { rotate: -2deg; } to { rotate: 2.5deg; } }

h1 {
  margin: 0;
  font-family: var(--font-story);
  font-size: clamp(60px, 13vw, 104px);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1;
}
.kana {
  margin: 12px 0 0 0.5em;
  font-size: clamp(17px, 2.6vw, 21px);
  letter-spacing: 0.5em;
  color: var(--paper-dim);
}
.credit {
  margin: 14px 0 0;
  font-family: var(--font-hand);
  font-size: clamp(19px, 2.4vw, 23px);
  color: var(--paper-dim);
}

nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: clamp(26px, 4.5vh, 38px) 0 clamp(22px, 3.5vh, 30px);
}
.choice {
  position: relative;
  display: grid;
  align-content: center;
  gap: 4px;
  min-height: 92px;
  padding: 14px 16px 12px;
  border: 1.5px solid var(--paper-faint);
  border-radius: 255px 14px 225px 12px / 12px 225px 14px 255px;
  color: var(--paper-on-ink);
  text-decoration: none;
  transition: background-color 180ms, border-color 180ms, transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.choice:hover,
.choice:focus-visible {
  background: rgba(243, 234, 214, 0.07);
  border-color: var(--paper-on-ink);
  transform: rotate(-0.6deg);
  outline: none;
}
.choice:focus-visible { box-shadow: 0 0 0 2px var(--sun); }
.label {
  font-size: clamp(25px, 3.4vw, 30px);
  line-height: 1.1;
}
.choice[lang='en'] .label { font-style: italic; }
.choice[lang='zh-CN'] .label { font-family: var(--font-kai); letter-spacing: 0.08em; }
.label::after {
  content: '';
  display: block;
  width: 0;
  height: 1.5px;
  margin: 6px auto 0;
  background: var(--sun);
  transition: width 240ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.choice:hover .label::after,
.choice:focus-visible .label::after,
.choice.last .label::after { width: 42px; }
.voice {
  font-family: var(--font-hand);
  font-size: 18px;
  color: var(--paper-faint);
}
.choice[lang='zh-CN'] .voice { font-family: var(--font-kai); font-size: 15px; letter-spacing: 0.06em; }
.last-time {
  position: absolute;
  top: -11px;
  right: 14px;
  padding: 0 8px;
  background: #f1e7cf;
  color: #2f261d;
  font-family: var(--font-hand);
  font-size: 15px;
  line-height: 1.45;
  rotate: 3deg;
  box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.35);
}

.note {
  margin: 0 auto;
  max-width: 30rem;
  padding-top: 16px;
  border-top: 1px solid var(--ink-line);
  font-size: 15px;
  line-height: 1.5;
  color: var(--paper-faint);
}
.note + .note { border-top: 0; padding-top: 4px; }
.note[lang='zh-CN'] { font-family: var(--font-kai); font-size: 14.5px; letter-spacing: 0.03em; }

.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

@media (max-width: 560px) {
  nav { grid-template-columns: 1fr; gap: 12px; }
  .choice { min-height: 78px; }
}
@media (max-height: 640px) {
  .flower { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .scene, .box, .flower { animation: none; }
}
</style>
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
 <filter id="ink-edge" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="12"/></filter>
</svg>
<div class="scene" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
<main>
 <section class="box" aria-labelledby="name">
  <img class="flower" src="assets/art/original/hima3.webp" alt="">
  <h1 id="name">Himawari</h1>
  <p class="kana" lang="ja">ひまわり</p>
  <p class="credit">A game by Liam McHara &amp; Albert Casals</p>
  <nav aria-label="Choose a language · 选择语言">
   <a class="choice" href="en/" lang="en" hreflang="en" data-code="en"><span class="label">Play in English</span><span class="voice">narrated by Harry</span></a>
   <a class="choice" href="zh-CN/" lang="zh-CN" hreflang="zh-CN" data-code="zh-CN"><span class="label">简体中文</span><span class="voice">朱利安朗读</span></a>
  </nav>
  <p class="note">The first visit downloads the game’s art, narration and music as you play.</p>
  <p class="note" lang="zh-CN">首次游玩时，游戏会一边玩一边下载画面、朗读和音乐。</p>
 </section>
</main>
<script>
(function () {
  var chosen = null;
  try { chosen = localStorage.getItem('himawari-language'); } catch (e) {}
  var links = document.querySelectorAll('.choice');
  for (var i = 0; i < links.length; i++) {
    var link = links[i];
    if (link.getAttribute('data-code') === chosen) {
      link.classList.add('last');
      var mark = document.createElement('span');
      mark.className = 'last-time';
      mark.textContent = chosen === 'zh-CN' ? '上次' : 'last time';
      mark.setAttribute('aria-hidden', 'true');
      link.appendChild(mark);
    }
    link.addEventListener('click', function () {
      try { localStorage.setItem('himawari-language', this.getAttribute('data-code')); } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
