name: Android app

# Every push builds the APK as a downloadable artifact. A release is published
# when the commit is pushed to the throwaway branch `release-drop` (see
# tools/release.sh): the workflow tags it v<version>, attaches the APK and
# deletes the branch. Publishing a release on GitHub, or pushing a v* tag,
# also attaches the APK to that release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Original rules, winning route and both language packs
        run: npm run test:logic
      # A persistent key (repository secrets HIMAWARI_KEYSTORE_BASE64 and
      # HIMAWARI_KEYSTORE_PASSWORD; alias himawari unless HIMAWARI_KEY_ALIAS
      # says otherwise) lets every release install over the previous one.
      # Without it, this release gets a one-off key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HIMAWARI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HIMAWARI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HIMAWARI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HIMAWARI_KEY_PASSWORD }}
        run: |
          store="$RUNNER_TEMP/himawari.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$store"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            {
              echo "HIMAWARI_KEYSTORE=$store"
              echo "HIMAWARI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "HIMAWARI_KEY_ALIAS=${KEY_ALIAS:-himawari}"
              echo "HIMAWARI_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "SIGNING=persistent"
            } >> "$GITHUB_ENV"
          else
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            keytool -genkeypair -keystore "$store" -storepass "$password" -keypass "$password" \
              -alias himawari -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Himawari" > /dev/null 2>&1
            {
              echo "HIMAWARI_KEYSTORE=$store"
              echo "HIMAWARI_KEYSTORE_PASSWORD=$password"
              echo "HIMAWARI_KEY_ALIAS=himawari"
              echo "HIMAWARI_KEY_PASSWORD=$password"
              echo "SIGNING=temporary"
            } >> "$GITHUB_ENV"
          fi

      # One app per language: the English app keeps the original app id, the
      # Chinese app is a separate app (see android/app/build.gradle).
      - name: Build the English and Chinese apps
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          for pair in en:English:EN zh-CN:Chinese:ZH; do
            IFS=: read -r edition label var <<< "$pair"
            python3 tools/build.py --app --edition "$edition"
            npx cap sync android
            (cd android && ./gradlew --no-daemon assembleRelease -PhimawariEdition="$edition")
            apk="Himawari-$version-$label.apk"
            mv android/app/build/outputs/apk/release/app-release.apk "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            echo "$apk signing key: $SIGNING"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -i 'SHA-256'
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -E "^package:|^application-label:" || true
            sha256sum "$apk" > "$apk.sha256"
            {
              echo "APK_$var=$apk"
              echo "SHA256_$var=$(cut -d' ' -f1 "$apk.sha256")"
              echo "MB_$var=$(( $(stat -c%s "$apk") / 1000000 ))"
            } >> "$GITHUB_ENV"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: himawari-android
          path: |
            Himawari-*.apk
            Himawari-*.apk.sha256
          retention-days: 30

      - name: Attach the APKs to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.ref == 'refs/heads/release-drop'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || (github.ref == 'refs/heads/release-drop' && format('v{0}', env.VERSION)) || github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          sed -e "s/{{VERSION}}/$VERSION/g" \
            -e "s/{{APK_EN}}/$APK_EN/g" -e "s/{{SHA256_EN}}/$SHA256_EN/g" -e "s/{{MB_EN}}/$MB_EN/g" \
            -e "s/{{APK_ZH}}/$APK_ZH/g" -e "s/{{SHA256_ZH}}/$SHA256_ZH/g" -e "s/{{MB_ZH}}/$MB_ZH/g" \
            .github/release-notes.md > "$notes"
          if [ "$SIGNING" = temporary ]; then cat .github/release-notes-temporary-key.md >> "$notes"; fi
          files=("$APK_EN" "$APK_EN.sha256" "$APK_ZH" "$APK_ZH.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --title "Himawari $VERSION" --notes-file "$notes"
            fi
          else
            # From release-drop the tag does not exist yet: create it at this commit.
            target=(--verify-tag)
            [ "$GITHUB_REF" = refs/heads/release-drop ] && target=(--target "$GITHUB_SHA")
            gh release create "$TAG" "${files[@]}" --title "Himawari $VERSION" --notes-file "$notes" "${target[@]}"
          fi

      - name: Delete the release-drop branch
        if: always() && github.ref == 'refs/heads/release-drop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release-drop" || true
